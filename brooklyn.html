<script>
    document.addEventListener("DOMContentLoaded", (event) => {
        gsap.registerPlugin(ScrollTrigger, SplitText);

        gsap.from("#image-container a", {
            opacity: 1,
            y: 100,
            duration: 3,
            stagger: 0.15,
            ease: "power2.out",
            scrollTrigger: {
                trigger: "#image-container",
                start: "top 80%",
                end: "bottom center",
                scrub: 1,
            },
        });

        gsap.from(".text-hover", {
            y: -50,
            opacity: 0,
            duration: 1.5,
            delay: 0.5,
            ease: "power3.out",
        });

        gsap.from(".titre-level-up", {
            y: -60,
            opacity: 0,
            duration: 1.5,
            delay: 0.9,
            ease: "power3.out",
        });

        const heroTextSplit = new SplitText("#morgann-text", {
            type: "words"
        });

        gsap.from(heroTextSplit.words, {
            y: 50,
            opacity: 0,
            rotationX: -90,
            stagger: 0.1,
            duration: 1,
            ease: "back.out(1.7)",
            scrollTrigger: {
                trigger: "#morgann-text",
                start: "top 80%",
                toggleActions: "play none none reverse",
            },
        });

        gsap.utils.toArray(".simple-separator").forEach(separator => {
            gsap.from(separator, {
                scaleX: 0,
                transformOrigin: "center right",
                duration: 1.5,
                ease: "power4.out",
                scrollTrigger: {
                    trigger: separator,
                    start: "top 95%",
                    end: "bottom 50%",
                    scrub: 0.5,
                    toggleActions: "play none none reverse",
                }
            });
        });
    });

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');

    menuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('active');
    });


    document.querySelectorAll('.letter').forEach(letter => {
        letter.addEventListener('mouseenter', function () {
            if (!this.classList.contains('animate')) {
                this.classList.add('animate');
                setTimeout(() => {
                    this.classList.remove('animate');
                }, 600);
            }
        });
    });
</script>

<script>



    const animationZone = document.querySelector('.hero-text');
    const animatedText = document.querySelector('.morgann-music');

    if (animationZone && animatedText) {

        const colorStart = getComputedStyle(document.documentElement).getPropertyValue('--light-color-start').trim();
        const colorEnd = getComputedStyle(document.documentElement).getPropertyValue('--light-color-end').trim();

        animationZone.addEventListener('mousemove', (e) => {
            const rect = animationZone.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const percentage = (x / rect.width) * 100;

            animatedText.style.background = `linear-gradient(90deg, ${colorStart} ${percentage - 20}%, ${colorEnd} ${percentage + 20}%)`;

            animatedText.style.webkitBackgroundClip = 'text';
            animatedText.style.webkitTextFillColor = 'transparent';
        });

        animationZone.addEventListener('mouseleave', () => {
            animatedText.style.background = `linear-gradient(90deg, ${colorStart} 0%, ${colorEnd} 100%)`;

            animatedText.style.webkitBackgroundClip = 'text';
            animatedText.style.webkitTextFillColor = 'transparent';

        });

    } else {
        console.error("Erreur: Les éléments .hero-text ou .morgann-music n'ont pas été trouvés dans le DOM.");
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const elementsToAnimate = document.querySelectorAll('.titre-page');

        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1

        };

        const observerCallback = (entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                } else {
                    entry.target.classList.remove('visible');
                }
            });
        };

        const observer = new IntersectionObserver(observerCallback, observerOptions);

        elementsToAnimate.forEach(element => {
            observer.observe(element);
        });
    });
</script>

<script>
    const liste = document.querySelector('.liste-album');
    const items = document.querySelectorAll('.liste-album li');

    items.forEach((item, index) => {
        item.style.transitionDelay = `${(index + 1) * 0.15}s`;
    });

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                liste.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.1
    });

    observer.observe(liste);
</script>
