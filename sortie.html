<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortie - Morgann Music Link</title>

    <!-- Balises Open Graph / Réseaux sociaux -->
    <meta property="OG:TITLE" id="metaOgTitle" content="Sortie - Morgann Music CP">
    <meta property="OG:DESCRIPTION" id="metaOgDesc"
        content="Découvrez cette sortie et écoutez les pistes en streaming sur Morgann Music CP.">
    <meta property="OG:IMAGE" id="metaOgImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">
    <meta property="OG:TYPE" content="music.album">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="metaTwitterTitle" content="Sortie - Morgann Music CP">
    <meta name="twitter:description" id="metaTwitterDesc"
        content="Découvrez cette sortie et écoutez les pistes en streaming sur Morgann Music CP.">
    <meta name="twitter:image" id="metaTwitterImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">

    <!-- Emplacement Schéma.org -->
    <div id="schemaContainer"></div>

    <link rel="stylesheet" href="/assets/css/navbar.css">
    <script type="module" src="/assets/js/navbar.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dynamic-bg, #164e32);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.8s ease;
            overflow-x: hidden;
            padding-top: 70px;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 80px;
        }

        .header-section {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 0;
        }

        .banner-wrapper {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background-color: transparent;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .banner-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 0 20px 30px 20px;
            background: transparent;
        }

        @media (max-width: 768px) {
            .header-section {
                justify-content: flex-end;
            }

            .banner-wrapper {
                width: 100%;
                height: 420px;
                border-radius: 0;
                margin-top: 0;
                margin-bottom: 0;
                box-shadow: none;
            }

            .banner-img,
            .banner-video {
                -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
                mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
            }

            .banner-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 20px 20px 30px 20px;
                background: linear-gradient(to top, var(--dynamic-bg, rgba(22, 78, 50, 0.95)) 0%, transparent 100%);
            }
        }

        .banner-img,
        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.98);
        }

        .banner-video {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .banner-wrapper.is-video-ready .banner-img {
            opacity: 0;
        }

        .banner-wrapper.is-video-ready .banner-video {
            opacity: 1;
            visibility: visible;
        }

        .release-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.15;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-bottom: 6px;
        }

        .release-artist {
            font-size: 1.1rem;
            color: #e0e0e0;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }

        .release-artist:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .platforms-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .platform-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        .platform-link-btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .content-section {
            padding: 25px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
            margin-top: 0;
        }

        .meta-card,
        .tracks-card {
            background-color: rgba(25, 25, 25, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 0.75rem;
            color: #aaa;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 700;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .tracks-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateX(3px);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .track-num {
            color: #aaa;
            font-weight: 800;
            width: 20px;
            flex-shrink: 0;
        }

        .track-name {
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.95rem;
        }

        .btn-track-action {
            background: #ffffff;
            color: #121212;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .track-item:hover .btn-track-action {
            background: #e0e0e0;
        }

        .loading-state,
        .error-state {
            text-align: center;
            padding: 100px 20px;
            color: #aaa;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="page-wrapper">
        <div class="header-section" id="headerSectionContainer">
            <div class="loading-state">Chargement de la sortie...</div>
        </div>

        <div class="content-section" id="contentSectionContainer" style="display:none;"></div>
    </div>

    <script>
        const API_BASE = "https://api.worker.mm-cp.uk";
        const urlParams = new URLSearchParams(window.location.search);
        const releaseId = urlParams.get('id');

        function resolveFileUrl(url) {
            if (!url || typeof url !== "string") return null;
            const value = String(url).trim();
            if (!value) return "";
            if (value.startsWith("http://") || value.startsWith("https://")) {
                if (value.includes(API_BASE)) return value;
                return `${API_BASE}/api/proxy-download?url=${encodeURIComponent(value)}`;
            }
            const cleanPath = value.replace(/^\/+/, "");
            if (cleanPath.startsWith("api/files/")) {
                return `${API_BASE}/${cleanPath}`;
            }
            return `${API_BASE}/api/files/${encodeURIComponent(cleanPath)}`;
        }

        async function loadReleaseDetails() {
            const headerContainer = document.getElementById("headerSectionContainer");
            if (!releaseId) {
                headerContainer.innerHTML = `<div class="error-state">Aucun identifiant de sortie spécifié dans l'URL.</div>`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/releases/${releaseId}`);
                if (!res.ok) {
                    headerContainer.innerHTML = `<div class="error-state">Sortie introuvable dans le catalogue.</div>`;
                    return;
                }
                const data = await res.json();
                const release = data.release || data;
                renderReleasePage(release);
            } catch (error) {
                console.error("Erreur chargement sortie :", error);
                headerContainer.innerHTML = `<div class="error-state">Erreur de chargement des données.</div>`;
            }
        }

        function renderReleasePage(data) {
            const headerContainer = document.getElementById("headerSectionContainer");
            const contentContainer = document.getElementById("contentSectionContainer");

            const title = data.title || "Sans titre";
            const artistName = data.artistName || data.artist_name || "Artiste inconnu";
            const type = data.type || "Single";
            const genre = data.genre || data.primaryGenre || "Non renseigné";
            const upc = data.upc || data.barcode || "N/A";

            const coverUrlRaw = data.coverUrl || data.cover_url || "";
            const coverUrl = resolveFileUrl(coverUrlRaw);

            document.title = `${title} - ${artistName} | Morgann Music CP`;
            const shareDesc = `Écoutez "${title}" par ${artistName} sur Morgann Music CP.`;
            const shareImage = coverUrl || 'https://mm-cp.uk/assets/img/icons/sombre.png';

            document.getElementById('metaOgTitle').setAttribute('content', `${title} - ${artistName}`);
            document.getElementById('metaOgDesc').setAttribute('content', shareDesc);
            document.getElementById('metaOgImage').setAttribute('content', shareImage);

            document.getElementById('metaTwitterTitle').setAttribute('content', `${title} - ${artistName}`);
            document.getElementById('metaTwitterDesc').setAttribute('content', shareDesc);
            document.getElementById('metaTwitterImage').setAttribute('content', shareImage);

            const schemaContainer = document.getElementById('schemaContainer');
            const customSchema = data.schema_json || data.schemaJson;

            if (customSchema && typeof customSchema === 'string') {
                if (customSchema.includes('<script')) {
                    schemaContainer.innerHTML = customSchema;
                } else {
                    const scriptTag = document.createElement('script');
                    scriptTag.type = 'application/ld+json';
                    scriptTag.textContent = customSchema;
                    schemaContainer.appendChild(scriptTag);
                }
            } else if (customSchema && typeof customSchema === 'object') {
                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.textContent = JSON.stringify(customSchema, null, 2);
                schemaContainer.appendChild(scriptTag);
            } else {
                const defaultSchema = {
                    "@context": "https://schema.org",
                    "@type": "MusicAlbum",
                    "name": title,
                    "url": window.location.href,
                    "image": shareImage,
                    "description": shareDesc,
                    "byArtist": {
                        "@type": "MusicGroup",
                        "name": artistName
                    }
                };
                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.textContent = JSON.stringify(defaultSchema, null, 2);
                schemaContainer.appendChild(scriptTag);
            }

            const animatedCoverRaw = data.animatedCoverUrl || data.animatedCover || data.appleMotion11;
            const animatedCoverUrl = resolveFileUrl(animatedCoverRaw);

            // Liste exhaustive de toutes les plateformes supportées
            const platformsConfig = [
                { key: 'spotifyUrl', altKey: 'spotify_url', label: 'Spotify' },
                { key: 'appleUrl', altKey: 'apple_url', label: 'Apple Music' },
                { key: 'deezerUrl', altKey: 'deezer_url', label: 'Deezer' },
                { key: 'amazonUrl', altKey: 'amazon_url', label: 'Amazon Music' },
                { key: 'youtubeMusicUrl', altKey: 'youtube_music_url', label: 'YouTube Music' },
                { key: 'tidalUrl', altKey: 'tidal_url', label: 'Tidal' },
                { key: 'qobuzUrl', altKey: 'qobuz_url', label: 'Qobuz' },
                { key: 'soundcloudUrl', altKey: 'soundcloud_url', label: 'SoundCloud' },
                { key: 'bandcampUrl', altKey: 'bandcamp_url', label: 'Bandcamp' },
                { key: 'napsterUrl', altKey: 'napster_url', label: 'Napster' },
                { key: 'pandoraUrl', altKey: 'pandora_url', label: 'Pandora' },
                { key: 'beatportUrl', altKey: 'beatport_url', label: 'Beatport' },
                { key: 'traxsourceUrl', altKey: 'traxsource_url', label: 'Traxsource' },
                { key: 'tiktokUrl', altKey: 'tiktok_url', label: 'TikTok' },
                { key: 'instagramUrl', altKey: 'instagram_url', label: 'Instagram' },
                { key: 'shazamUrl', altKey: 'shazam_url', label: 'Shazam' },
                { key: 'tencentUrl', altKey: 'tencent_url', label: 'Tencent' },
                { key: 'neteaseUrl', altKey: 'netease_url', label: 'NetEase' },
                { key: 'boomplayUrl', altKey: 'boomplay_url', label: 'Boomplay' },
                { key: 'anghamiUrl', altKey: 'anghami_url', label: 'Anghami' },
                { key: 'vkUrl', altKey: 'vk_url', label: 'VKontakte' },
                { key: 'yandexUrl', altKey: 'yandex_url', label: 'Yandex' },
                { key: 'releaseUrl', altKey: 'release_url', label: 'Lien de sortie' }
            ];

            let platformsHtml = '';
            platformsConfig.forEach(p => {
                const urlVal = data[p.key] || data[p.altKey] || "";
                if (urlVal && String(urlVal).trim() !== "") {
                    platformsHtml += `<a href="${urlVal}" target="_blank" rel="noopener noreferrer" class="platform-link-btn">${p.label}</a>`;
                }
            });

            headerContainer.innerHTML = `
                <div class="banner-wrapper" id="bannerWrapper">
                    ${coverUrl ? `<img src="${coverUrl}" alt="${title}" class="banner-img" id="releaseCoverImg">` : `<div style="width:100%; height:100%; background:#222;"></div>`}
                    ${animatedCoverUrl ? `<video src="${animatedCoverUrl}" autoplay loop muted playsinline preload="metadata" class="banner-video"></video>` : ''}
                </div>
                <div class="banner-overlay">
                    <h1 class="release-title">${title}</h1>
                    ${artistName ? `<a href="artiste.html?name=${encodeURIComponent(artistName)}" class="release-artist">${artistName}</a>` : ''}
                    <div class="platforms-links">
                        ${platformsHtml}
                    </div>
                </div>
            `;

            const releaseDateRaw = data.originalReleaseDate || data.releaseDate;
            let formattedDate = "Non précisée";
            if (releaseDateRaw) {
                formattedDate = new Date(releaseDateRaw).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
            }

            let pistesGlobales = data.tracks || [];
            if (typeof pistesGlobales === 'string') {
                try { pistesGlobales = JSON.parse(pistesGlobales); } catch (e) { pistesGlobales = []; }
            }

            let tracksItemsHtml = "";
            const playBaseUrl = `https://play.morgannmusic.uk/sortie?id=${releaseId}`;

            if (Array.isArray(pistesGlobales) && pistesGlobales.length > 0) {
                tracksItemsHtml = pistesGlobales.map((track, index) => {
                    let trackTitle = typeof track === 'object' ? (track.title || track.name || 'Piste ' + (index + 1)) : track;
                    return `
                    <a href="${playBaseUrl}" target="_blank" rel="noopener noreferrer" class="track-item">
                        <div class="track-left">
                            <span class="track-num">${String(index + 1).padStart(2, '0')}</span>
                            <span class="track-name">${trackTitle}</span>
                        </div>
                        <button class="btn-track-action">Écouter</button>
                    </a>
                `;
                }).join("");
            } else {
                tracksItemsHtml = `<div style="color:#aaa; font-size:0.9rem; text-align:center; padding: 10px;">Aucune piste disponible.</div>`;
            }

            contentContainer.innerHTML = `
                <div class="meta-card">
                    <div class="section-title" style="margin-bottom: 12px;">Informations</div>
                    <div class="meta-grid">
                        <div class="meta-item"><span class="meta-label">Date de Sortie</span><span class="meta-value">${formattedDate}</span></div>
                        <div class="meta-item"><span class="meta-label">Format / Type</span><span class="meta-value">${type}</span></div>
                        <div class="meta-item"><span class="meta-label">Genre</span><span class="meta-value">${genre}</span></div>
                        <div class="meta-item"><span class="meta-label">UPC / Barcode</span><span class="meta-value">${upc}</span></div>
                    </div>
                </div>

                <div class="tracks-card">
                    <div class="section-title">Pistes (${pistesGlobales.length})</div>
                    <ul class="tracks-list">${tracksItemsHtml}</ul>
                </div>
            `;

            contentContainer.style.display = "flex";

            const bannerWrapper = headerContainer.querySelector('#bannerWrapper');
            if (bannerWrapper) {
                const video = bannerWrapper.querySelector('video');
                if (video) {
                    video.addEventListener('loadeddata', () => bannerWrapper.classList.add('is-video-ready'), { once: true });
                }
            }

            if (coverUrl) {
                extractSingleBrightColor(coverUrl);
            }
        }

        function extractSingleBrightColor(imageUrl) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imageUrl;
            img.onload = function () {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const pixel = ctx.getImageData(Math.floor(img.width / 2), Math.floor(img.height / 3), 1, 1).data;
                    const r = pixel[0], g = pixel[1], b = pixel[2];

                    const brightRgb = `rgb(${r}, ${g}, ${b})`;
                    const overlayRgb = `rgba(${r}, ${g}, ${b}, 0.95)`;

                    document.documentElement.style.setProperty('--dynamic-bg', brightRgb);

                    const overlay = document.querySelector('.banner-overlay');
                    if (overlay && window.innerWidth <= 768) {
                        overlay.style.background = `linear-gradient(to top, ${overlayRgb} 0%, transparent 100%)`;
                    }
                } catch (e) {
                    console.log("Erreur extraction couleur:", e);
                }
            };
        }

        window.addEventListener('DOMContentLoaded', loadReleaseDetails);
    </script>
</body>

</html>
