<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortie - Morgann Music CP</title>

    <!-- Balises Open Graph / Réseaux sociaux (mises à jour dynamiquement) -->
    <meta property="OG:TITLE" id="metaOgTitle" content="Sortie - Morgann Music CP">
    <meta property="OG:DESCRIPTION" id="metaOgDesc"
        content="Découvrez cette sortie et écoutez les pistes en streaming sur Morgann Music CP.">
    <meta property="OG:IMAGE" id="metaOgImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">
    <meta property="OG:TYPE" content="music.album">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="metaTwitterTitle" content="Sortie - Morgann Music CP">
    <meta name="twitter:description" id="metaTwitterDesc"
        content="Découvrez cette sortie et écoutez les pistes en streaming sur Morgann Music CP.">
    <meta name="twitter:image" id="metaTwitterImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">

    <script type="module" src="/assets/js/navbar.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dynamic-bg, #164e32);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.8s ease;
            overflow-x: hidden;
            margin-top: 0;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 120px;
        }

        .header-section {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 0;
        }

        /* Par défaut (Ordinateur) : Carré centré non étiré */
        .banner-wrapper {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background-color: transparent;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .banner-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 0 20px 30px 20px;
            background: transparent;
        }

        /* Sur Téléphone : Plein écran avec fondu vers le bas (comme avant) */
        @media (max-width: 768px) {
            .header-section {
                justify-content: flex-end;
            }

            .banner-wrapper {
                width: 100%;
                height: 420px;
                border-radius: 0;
                margin-top: 0;
                margin-bottom: 0;
                box-shadow: none;
            }

            .banner-img,
            .banner-video {
                -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
                mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
            }

            .banner-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 20px 20px 30px 20px;
                background: linear-gradient(to top, var(--dynamic-bg, rgba(22, 78, 50, 0.95)) 0%, transparent 100%);
            }
        }

        .banner-img,
        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.98);
        }

        .banner-video {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .banner-wrapper.is-video-ready .banner-img {
            opacity: 0;
        }

        .banner-wrapper.is-video-ready .banner-video {
            opacity: 1;
            visibility: visible;
        }

        .release-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.15;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-bottom: 6px;
        }

        .release-artist {
            font-size: 1.1rem;
            color: #e0e0e0;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }

        .release-artist:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .platforms-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .platform-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        .platform-link-btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .content-section {
            padding: 25px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
            margin-top: 0;
        }

        .meta-card,
        .tracks-card {
            background-color: rgba(25, 25, 25, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 0.75rem;
            color: #aaa;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 700;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .tracks-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateX(3px);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .track-num {
            color: #aaa;
            font-weight: 800;
            width: 20px;
            flex-shrink: 0;
        }

        .track-name {
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.95rem;
        }

        .track-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-track-action {
            background: #ffffff;
            color: #121212;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-track-action:hover {
            background: #e0e0e0;
        }

        .btn-lyrics-toggle {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-lyrics-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .player-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: calc(100% - 30px);
            max-width: 600px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 9990;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }

        .player-bar.visible {
            transform: translateX(-50%) translateY(0);
        }

        .player-track-title {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .player-controls-main {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .player-time {
            font-size: 0.75rem;
            color: #aaa;
            font-variant-numeric: tabular-nums;
            min-width: 32px;
            text-align: center;
        }

        .player-progress {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .player-progress-bar {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s linear;
        }

        .btn-play-pause {
            background: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #121212;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .lyrics-overlay {
            position: fixed;
            inset: 0;
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .lyrics-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lyrics-header-info h4 {
            color: #fff;
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .lyrics-header-info p {
            color: #aaa;
            margin: 3px 0 0 0;
            font-size: 0.85rem;
        }

        .lyrics-close-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lyrics-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lyrics-body {
            flex: 1;
            overflow-y: auto;
            padding: 60px 20px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
            text-align: center;
        }

        .lyrics-body::-webkit-scrollbar {
            width: 0px;
        }

        .lyric-line {
            font-size: 1.6rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            margin: 28px 0;
            line-height: 1.4;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            filter: blur(4px);
            opacity: 0.25;
            transform: scale(0.96);
        }

        .lyric-line:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .lyric-line.active {
            color: #ffffff;
            font-size: 2rem;
            filter: blur(0px);
            opacity: 1;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }

        .lyric-line.dist-1 {
            filter: blur(1.5px);
            opacity: 0.65;
            transform: scale(0.99);
        }

        .lyric-line.dist-2 {
            filter: blur(3px);
            opacity: 0.4;
            transform: scale(0.97);
        }

        .lyric-line.dist-3 {
            filter: blur(5px);
            opacity: 0.18;
            transform: scale(0.95);
        }

        .lyric-line.dist-far {
            filter: blur(7px);
            opacity: 0.05;
            transform: scale(0.93);
        }

        .loading-state,
        .error-state {
            text-align: center;
            padding: 100px 20px;
            color: #aaa;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div class="header-section" id="headerSectionContainer">
            <div class="loading-state">Chargement de la sortie...</div>
        </div>

        <div class="content-section" id="contentSectionContainer" style="display:none;"></div>
    </div>

    <div id="lyrics-overlay" class="lyrics-overlay">
        <div class="lyrics-header">
            <div class="lyrics-header-info">
                <h4 id="lyrics-modal-title">Titre de la piste</h4>
                <p id="lyrics-modal-artist">Artiste</p>
            </div>
            <button class="lyrics-close-btn" onclick="fermerParoles()">✕</button>
        </div>
        <div class="lyrics-body" id="lyrics-container-box"></div>
    </div>

    <div id="player-bar" class="player-bar">
        <button class="btn-play-pause" id="bar-play-btn" onclick="togglePlayPauseBar()">▶</button>
        <div class="player-track-title" id="bar-title">Sélectionner une piste</div>
        <div class="player-controls-main">
            <span class="player-time" id="bar-current-time">0:00</span>
            <div class="player-progress" id="bar-progress-container" onclick="seekAudioBar(event)">
                <div class="player-progress-bar" id="bar-progress-fill"></div>
            </div>
            <span class="player-time" id="bar-duration">0:00</span>
        </div>
        <button class="btn-track-action" id="bar-lyrics-btn" onclick="ouvrirParolesActives()"
            style="padding: 5px 10px; font-size: 0.75rem; display:none;">🎤 Paroles</button>
    </div>

    <script>
        const API_BASE = "https://api.worker.mm-cp.uk";
        const urlParams = new URLSearchParams(window.location.search);
        const releaseId = urlParams.get('id');

        let lecteurActif = null;
        let indexPisteActive = null;
        let pistesGlobales = [];
        let infoSortieGlobale = {};

        function resolveFileUrl(url) {
            if (!url || typeof url !== "string") return null;
            const value = String(url).trim();
            if (!value) return "";
            if (value.startsWith("http://") || value.startsWith("https://") || value.startsWith("data:")) {
                return value;
            }
            const cleanPath = value.replace(/^\/+/, "");
            if (cleanPath.startsWith("api/files/")) {
                return `${API_BASE}/${cleanPath}`;
            }
            return `${API_BASE}/api/files/${encodeURIComponent(cleanPath)}`;
        }

        async function loadReleaseDetails() {
            const headerContainer = document.getElementById("headerSectionContainer");
            if (!releaseId) {
                headerContainer.innerHTML = `<div class="error-state">Aucun identifiant de sortie spécifié dans l'URL.</div>`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/releases/${releaseId}`);
                if (!res.ok) {
                    headerContainer.innerHTML = `<div class="error-state">Sortie introuvable dans le catalogue.</div>`;
                    return;
                }
                const data = await res.json();
                const release = data.release || data;
                infoSortieGlobale = release;
                renderReleasePage(release);
            } catch (error) {
                console.error("Erreur chargement sortie :", error);
                headerContainer.innerHTML = `<div class="error-state">Erreur de chargement des données.</div>`;
            }
        }

        function renderReleasePage(data) {
            const headerContainer = document.getElementById("headerSectionContainer");
            const contentContainer = document.getElementById("contentSectionContainer");

            const title = data.title || "Sans titre";
            const artistName = data.artistName || data.artist_name || "Artiste inconnu";
            const type = data.type || "Single";
            const genre = data.genre || data.primaryGenre || "Non renseigné";
            const upc = data.upc || data.barcode || "N/A";

            const coverUrlRaw = data.coverUrl || data.cover_url || "";
            const coverUrl = resolveFileUrl(coverUrlRaw);

            // --- MISE À JOUR DYNAMIQUE DES MÉTADONNÉES DE PARTAGE (Open Graph / Twitter) ---
            document.title = `${title} - ${artistName} | Morgann Music CP`;

            const shareDesc = `Écoutez "${title}" par ${artistName} sur Morgann Music CP.`;
            const shareImage = coverUrl || 'https://mm-cp.uk/assets/img/icons/sombre.png';

            document.getElementById('metaOgTitle').setAttribute('content', `${title} - ${artistName}`);
            document.getElementById('metaOgDesc').setAttribute('content', shareDesc);
            document.getElementById('metaOgImage').setAttribute('content', shareImage);

            document.getElementById('metaTwitterTitle').setAttribute('content', `${title} - ${artistName}`);
            document.getElementById('metaTwitterDesc').setAttribute('content', shareDesc);
            document.getElementById('metaTwitterImage').setAttribute('content', shareImage);
            // -----------------------------------------------------------------------------

            const appleUrl = data.appleUrl || data.apple_url || data.releaseUrl || "";
            const spotifyUrl = data.spotifyUrl || data.spotify_url || "";

            const animatedCoverRaw = data.animatedCoverUrl || data.animatedCover || data.appleMotion11;
            const animatedCoverUrl = resolveFileUrl(animatedCoverRaw);

            let platformsHtml = '';
            if (appleUrl) {
                platformsHtml += `<a href="${appleUrl}" target="_blank" rel="noopener noreferrer" class="platform-link-btn">Apple Music</a>`;
            }
            if (spotifyUrl) {
                platformsHtml += `<a href="${spotifyUrl}" target="_blank" rel="noopener noreferrer" class="platform-link-btn">Spotify</a>`;
            }

            headerContainer.innerHTML = `
                <div class="banner-wrapper" id="bannerWrapper">
                    ${coverUrl ? `<img src="${coverUrl}" crossorigin="anonymous" alt="${title}" class="banner-img" id="releaseCoverImg">` : `<div style="width:100%; height:100%; background:#222;"></div>`}
                    ${animatedCoverUrl ? `<video src="${animatedCoverUrl}" autoplay loop muted playsinline preload="metadata" class="banner-video"></video>` : ''}
                </div>
                <div class="banner-overlay">
                    <h1 class="release-title">${title}</h1>
                    ${artistName ? `<a href="artiste.html?name=${encodeURIComponent(artistName)}" class="release-artist">${artistName}</a>` : ''}
                    <div class="platforms-links">
                        ${platformsHtml}
                    </div>
                </div>
            `;

            const releaseDateRaw = data.originalReleaseDate || data.releaseDate;
            let formattedDate = "Non précisée";
            if (releaseDateRaw) {
                formattedDate = new Date(releaseDateRaw).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
            }

            pistesGlobales = data.tracks || [];
            if (typeof pistesGlobales === 'string') {
                try { pistesGlobales = JSON.parse(pistesGlobales); } catch (e) { pistesGlobales = []; }
            }

            let tracksItemsHtml = "";
            if (Array.isArray(pistesGlobales) && pistesGlobales.length > 0) {
                tracksItemsHtml = pistesGlobales.map((track, index) => {
                    let trackTitle = typeof track === 'object' ? (track.title || track.name || 'Piste ' + (index + 1)) : track;
                    let audioUrlRaw = typeof track === 'object' ? (track.audioUrl || track.audio_url || track.fileUrl || track.file_url || track.url) : null;
                    const hasAudio = Boolean(audioUrlRaw);
                    const hasLyrics = typeof track === 'object' && Boolean(track.lyricsText && track.lyricsText.trim());

                    return `
                    <li class="track-item" onclick="${hasAudio ? `jouerPiste(${index})` : ''}">
                        <div class="track-left">
                            <span class="track-num">${String(index + 1).padStart(2, '0')}</span>
                            <span class="track-name">${trackTitle}</span>
                        </div>
                        <div class="track-controls" onclick="event.stopPropagation()">
                            ${hasLyrics ? `<button class="btn-lyrics-toggle" onclick="ouvrirParolesPiste(${index})">🎤 Paroles</button>` : ''}
                            ${hasAudio ? `<button class="btn-track-action" onclick="jouerPiste(${index})">Lecture</button>` : `<span style="font-size:0.75rem; color:#aaa; font-style:italic;">Indisponible</span>`}
                        </div>
                    </li>
                `;
                }).join("");
            } else {
                tracksItemsHtml = `<div style="color:#aaa; font-size:0.9rem; text-align:center; padding: 10px;">Aucune piste disponible.</div>`;
            }

            contentContainer.innerHTML = `
                <div class="meta-card">
                    <div class="section-title" style="margin-bottom: 12px;">Informations</div>
                    <div class="meta-grid">
                        <div class="meta-item"><span class="meta-label">Date de Sortie</span><span class="meta-value">${formattedDate}</span></div>
                        <div class="meta-item"><span class="meta-label">Format / Type</span><span class="meta-value">${type}</span></div>
                        <div class="meta-item"><span class="meta-label">Genre</span><span class="meta-value">${genre}</span></div>
                        <div class="meta-item"><span class="meta-label">UPC / Barcode</span><span class="meta-value">${upc}</span></div>
                    </div>
                </div>

                <div class="tracks-card">
                    <div class="section-title">Pistes (${pistesGlobales.length})</div>
                    <ul class="tracks-list">${tracksItemsHtml}</ul>
                </div>
            `;

            contentContainer.style.display = "flex";

            const bannerWrapper = headerContainer.querySelector('#bannerWrapper');
            if (bannerWrapper) {
                const video = bannerWrapper.querySelector('video');
                if (video) {
                    video.addEventListener('loadeddata', () => bannerWrapper.classList.add('is-video-ready'), { once: true });
                }
            }

            if (coverUrl) {
                extractSingleBrightColor(coverUrl);
            }
        }

        function extractSingleBrightColor(imageUrl) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imageUrl;
            img.onload = function () {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const pixel = ctx.getImageData(Math.floor(img.width / 2), Math.floor(img.height / 3), 1, 1).data;
                    const r = pixel[0], g = pixel[1], b = pixel[2];

                    const brightRgb = `rgb(${r}, ${g}, ${b})`;
                    const overlayRgb = `rgba(${r}, ${g}, ${b}, 0.95)`;

                    document.documentElement.style.setProperty('--dynamic-bg', brightRgb);

                    const overlay = document.querySelector('.banner-overlay');
                    if (overlay && window.innerWidth <= 768) {
                        overlay.style.background = `linear-gradient(to top, ${overlayRgb} 0%, transparent 100%)`;
                    }
                } catch (e) {
                    console.log("Erreur extraction couleur:", e);
                }
            };
        }

        window.jouerPiste = function (index) {
            const track = pistesGlobales[index];
            if (!track) return;
            const audioUrlRaw = track.audioUrl || track.audio_url || track.fileUrl || track.file_url || track.url;
            const audioUrl = resolveFileUrl(audioUrlRaw);
            if (!audioUrl) return;

            if (lecteurActif) {
                lecteurActif.pause();
                lecteurActif = null;
            }

            indexPisteActive = index;
            lecteurActif = new Audio(audioUrl);

            const trackTitle = track.title || track.name || `Piste ${index + 1}`;
            document.getElementById("bar-title").textContent = trackTitle;
            document.getElementById("player-bar").classList.add("visible");

            const hasLyrics = Boolean(track.lyricsText && track.lyricsText.trim());
            document.getElementById("bar-lyrics-btn").style.display = hasLyrics ? "inline-block" : "none";

            lecteurActif.play().catch(e => console.log("Autoplay bloqué:", e));
            document.getElementById("bar-play-btn").textContent = "❚❚";

            lecteurActif.addEventListener("timeupdate", () => {
                if (!lecteurActif) return;
                const current = lecteurActif.currentTime;
                const duration = lecteurActif.duration || 0;

                document.getElementById("bar-current-time").textContent = formatTime(current);
                document.getElementById("bar-duration").textContent = formatTime(duration);

                const pct = duration > 0 ? (current / duration) * 100 : 0;
                document.getElementById("bar-progress-fill").style.width = `${pct}%`;

                mettreAJourLignesParoles(current);
            });

            lecteurActif.addEventListener("ended", () => {
                document.getElementById("bar-play-btn").textContent = "▶";
            });
        };

        window.togglePlayPauseBar = function () {
            if (!lecteurActif) {
                if (pistesGlobales.length > 0) jouerPiste(0);
                return;
            }
            const playBtn = document.getElementById("bar-play-btn");
            if (lecteurActif.paused) {
                lecteurActif.play();
                playBtn.textContent = "❚❚";
            } else {
                lecteurActif.pause();
                playBtn.textContent = "▶";
            }
        };

        window.seekAudioBar = function (e) {
            if (!lecteurActif || !lecteurActif.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            lecteurActif.currentTime = (clickX / width) * lecteurActif.duration;
        };

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        let parsedLyricsArray = [];

        window.ouvrirParolesActives = function () {
            if (indexPisteActive === null) return;
            ouvrirParolesPiste(indexPisteActive);
        };

        window.ouvrirParolesPiste = function (index) {
            const track = pistesGlobales[index];
            if (!track || !track.lyricsText) return;

            document.getElementById("lyrics-modal-title").textContent = track.title || track.name || `Piste ${index + 1}`;
            document.getElementById("lyrics-modal-artist").textContent = infoSortieGlobale.artistName || infoSortieGlobale.artist_name || "Artiste";

            parsedLyricsArray = parserLrc(track.lyricsText);
            const container = document.getElementById("lyrics-container-box");
            container.innerHTML = "";

            if (parsedLyricsArray.length === 0) {
                container.innerHTML = `<div style="color:#aaa; font-size:1.1rem; padding:40px; white-space:pre-line;">${track.lyricsText}</div>`;
            } else {
                parsedLyricsArray.forEach((item) => {
                    const div = document.createElement("div");
                    div.className = "lyric-line";
                    div.textContent = item.text;
                    div.onclick = () => {
                        if (lecteurActif) lecteurActif.currentTime = item.time;
                    };
                    container.appendChild(div);
                });
            }

            document.getElementById("lyrics-overlay").classList.add("active");
        };

        window.fermerParoles = function () {
            document.getElementById("lyrics-overlay").classList.remove("active");
        };

        function parserLrc(rawText) {
            const lines = rawText.split("\n");
            const result = [];
            const timeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/;

            for (const line of lines) {
                const match = timeRegex.exec(line);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const millis = match[3] ? parseInt(match[3].padEnd(3, '0'), 10) / 1000 : 0;
                    const totalSeconds = minutes * 60 + seconds + millis;
                    const text = line.replace(timeRegex, "").trim();
                    if (text) {
                        result.push({ time: totalSeconds, text });
                    }
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        function mettreAJourLignesParoles(currentTime) {
            if (parsedLyricsArray.length === 0) return;
            const lines = document.querySelectorAll(".lyric-line");
            if (lines.length === 0) return;

            const adjustedTime = currentTime + 0.4;
            let activeIndex = -1;
            for (let i = 0; i < parsedLyricsArray.length; i++) {
                if (adjustedTime >= parsedLyricsArray[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            lines.forEach((el, idx) => {
                el.className = "lyric-line";
                if (idx === activeIndex) {
                    el.classList.add("active");
                    el.scrollIntoView({ behavior: "smooth", block: "center" });
                } else {
                    const distance = Math.abs(idx - activeIndex);
                    if (distance === 1) el.classList.add("dist-1");
                    else if (distance === 2) el.classList.add("dist-2");
                    else if (distance === 3) el.classList.add("dist-3");
                    else el.classList.add("dist-far");
                }
            });
        }

        window.addEventListener('DOMContentLoaded', loadReleaseDetails);
    </script>
</body>
