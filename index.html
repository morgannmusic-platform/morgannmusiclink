<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Morgann Music Link</title>

    <!-- Meta de base -->
    <meta name="theme-color" content="#000c8e">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <!-- CSS de base et CSS de la navbar -->
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>

<body>
    <!-- Conteneur pour injecter la navbar automatiquement -->
    <div id="navbar-container"></div>

    <!-- En-tête : Présentation de Morgann Music Link -->
    <header class="mml-header">
        <h1 class="mml-title">Morgann Music Link</h1>
        <p class="mml-subtitle">Ton accès direct à l'univers.</p>
    </header>

    <main class="mml-main-content">
        <!-- Rangée 1 : Les 5 artistes avec le plus de sorties -->
        <section class="mml-section" id="top-artistes-section">
            <h2 class="section-heading">Top Artistes</h2>

            <!-- Le JS viendra injecter les 5 artistes ici -->
            <div class="mml-grid" id="artistes-container">
                <!-- Vide en dur : remplissage via l'API -->
            </div>
        </section>

        <!-- Séparateur visuel si besoin dans le CSS -->
        <div class="simple-separator"></div>

        <!-- Rangée 2 : Les 5 dernières sorties -->
        <section class="mml-section" id="dernieres-sorties-section">
            <h2 class="section-heading">Dernières Sorties</h2>

            <!-- Le JS viendra injecter les 5 pochettes et titres ici -->
            <div class="mml-grid" id="sorties-container">
                <!-- Vide en dur : remplissage via l'API -->
            </div>
        </section>
    </main>

    <!-- Pied de page refait -->
    <footer class="mml-footer">
        <p>Morgann Music © <span id="current-year"></span> Tous droits réservés.</p>
    </footer>

    <!-- Script automatique pour l'année du footer -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>

    <!-- Scripts JS : Navbar et index -->
    <script src="/assets/js/navbar.js"></script>
    <script src="/assets/js/index.js"></script>
</body>

</html>
